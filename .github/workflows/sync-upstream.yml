name: Sync upstream

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/sync-upstream.yml'

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fork
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Merge upstream while preserving fork workflows
        env:
          UPSTREAM_REPOSITORY: lidge-jun/opencodex
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          upstream_branch="$(git ls-remote --symref upstream HEAD | awk '$1 == "ref:" && $3 == "HEAD" {sub(/^refs\/heads\//, "", $2); print $2; exit}')"
          if [[ -z "${upstream_branch}" ]]; then
            echo "Could not determine upstream default branch." >&2
            exit 1
          fi
          echo "Following upstream default branch: ${upstream_branch}"
          git fetch --no-tags upstream "${upstream_branch}"

          if git merge-base --is-ancestor FETCH_HEAD HEAD; then
            echo 'Fork main already contains the latest upstream commit.'
            exit 0
          fi

          set +e
          git merge --no-commit --no-ff FETCH_HEAD
          merge_status=$?
          set -e

          if [[ ! -f .git/MERGE_HEAD ]]; then
            echo "Unable to start the upstream merge (status ${merge_status})." >&2
            exit "${merge_status}"
          fi

          git rm -r -f --ignore-unmatch .github/workflows >/dev/null 2>&1 || true
          git checkout HEAD -- .github/workflows

          unresolved="$(git diff --name-only --diff-filter=U)"
          if [[ -n "${unresolved}" ]]; then
            echo 'Upstream has non-workflow conflicts that require review:' >&2
            printf '%s\n' "${unresolved}" >&2
            git merge --abort
            exit 1
          fi

          git add -A
          git commit -m 'chore: sync upstream (preserve fork workflows)'
          git push origin HEAD:main
